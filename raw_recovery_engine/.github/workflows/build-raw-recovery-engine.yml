name: Build RawRecoveryEngine (Windows)

# Dois jeitos de disparar:
#   1) Manual, a qualquer momento, pelo botão "Run workflow" na aba Actions do GitHub.
#   2) Automático, quando uma tag no formato "raw-recovery-engine-v*" for enviada
#      (ex: git tag raw-recovery-engine-v1.0.0 && git push origin raw-recovery-engine-v1.0.0)
#      — nesse caso, além de buildar, publica uma Release no GitHub com o .exe anexado.
#
# Empurrar mudanças em raw_recovery_engine/** para qualquer branch também builda (sem
# publicar release), só para validar que o build não quebrou.

on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
    paths:
      - 'raw_recovery_engine/**'
      - '.github/workflows/build-raw-recovery-engine.yml'
    tags:
      - 'raw-recovery-engine-v*'

permissions:
  contents: write   # necessário para publicar a Release quando a tag disparar o workflow

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: raw_recovery_engine

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: raw_recovery_engine/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build com PyInstaller
        run: pyinstaller --clean --noconfirm RawRecoveryEngine.spec

      - name: Testar o binário gerado (smoke test)
        run: |
          .\dist\RawRecoveryEngine.exe version
          if ($LASTEXITCODE -ne 0) { throw "Smoke test falhou: RawRecoveryEngine.exe version retornou código $LASTEXITCODE" }

      - name: Calcular SHA-256
        run: |
          $hash = Get-FileHash .\dist\RawRecoveryEngine.exe -Algorithm SHA256
          $hash.Hash | Out-File -Encoding ascii .\dist\RawRecoveryEngine.exe.sha256
          Write-Host "SHA-256: $($hash.Hash)"

      - name: Publicar artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: RawRecoveryEngine-windows
          path: |
            raw_recovery_engine/dist/RawRecoveryEngine.exe
            raw_recovery_engine/dist/RawRecoveryEngine.exe.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publicar Release (apenas em push de tag)
        if: startsWith(github.ref, 'refs/tags/raw-recovery-engine-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            raw_recovery_engine/dist/RawRecoveryEngine.exe
            raw_recovery_engine/dist/RawRecoveryEngine.exe.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
