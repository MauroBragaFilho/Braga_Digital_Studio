name: Release BDS (Windows + Linux)

# Builda o BDS para Windows E Linux em paralelo e publica os dois numa ÚNICA Release do GitHub.
#
# Como publica (sem artefatos do Actions, cuja cota de 500 MB bloqueava a segunda release do mês):
#   1. create-release cria a Release em RASCUNHO no repositório de releases (RELEASES_REPO);
#   2. cada build envia seus arquivos direto para ela com `gh release upload` (mais um SHA256SUMS-<sistema>.txt);
#   3. release junta as listas no SHA256SUMS.txt e tira a Release do rascunho — só se os dois builds deram certo.
#
# Quando roda:
#   - Ao enviar uma TAG de versão (vX.Y.Z), por exemplo:
#        git tag v1.0.5
#        git push origin v1.0.5
#     A versão da Release é a da tag (sem o "v"); os instaladores já saem com ela. Reenviar a mesma tag
#     (git push --force origin v1.0.5) refaz a Release e substitui os arquivos.
#   - Manual: aba Actions -> "Release BDS (Windows + Linux)" -> "Run workflow". Sem tag, a versão é a próxima livre
#     a partir do package.json (1.0.4 -> 1.0.5 ...) e o workflow registra a versão nova no package.json, com um commit
#     "chore(release): vX.Y.Z [skip release]" na main.
#   - Pushes na main NÃO geram release (só o CI roda).
#
# Os workflows build-bds-release.yml e build-bds-linux.yml (uma plataforma só) ficam apenas como execução manual,
# para não rodarem em duplicidade quando a tag é enviada.
#
# Pré-requisitos (mesmos dos workflows individuais):
#   - assets/icon.ico (Windows) e assets/icon.png (Linux) precisam existir no repositório.
#   - A pasta data/ não precisa estar versionada — cada job cria uma vazia antes do build.
#   - Em Settings -> Actions -> General, "Workflow permissions" deve permitir leitura e escrita
#     (e, se a branch main tiver proteção, o github-actions[bot] precisa poder dar push nela).

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# As RELEASES (instaladores) são publicadas em um repositório SEPARADO do código: é de lá que o atualizador do app
# baixa (src/config/appUpdate.config.json). Precisa do segredo RELEASES_TOKEN (Settings -> Secrets and variables -> Actions
# deste repositório): token com permissão de escrita em "Contents" do repositório de releases.
env:
  RELEASES_REPO: MauroBragaFilho/Braga_Digital_Studio
  # Nome-base dos arquivos no padrão do ArtCraft Launcher (<stem>-<versão>-<os>-<arch>[-portable].<ext>), para o BDS poder
  # entrar no catálogo dele: zip portátil no Windows (exe na raiz, com o nome do stem) e AppImage no Linux.
  # Os instaladores atuais (BragaDigitalStudioSetup.*, lidos pelo atualizador do app) continuam na mesma release.
  LAUNCHER_STEM: braga-digital-studio

# Mínimo por padrão; só o job `release` (publica a Release e dá push da versão) recebe contents: write.
permissions:
  contents: read

# Um release por vez: pushes seguidos entram em fila, para não disputar a mesma versão.
concurrency:
  group: release-bds
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------------------------
  # Lê a versão atual do package.json UMA VEZ e compartilha com os demais jobs, para que
  # a tag/Release use exatamente essa versão, sem risco de builds paralelos lerem valores
  # diferentes (ex: se o package.json mudasse entre um job e outro).
  # ------------------------------------------------------------------------------------
  determine-version:
    # Tag de versão sempre gera a Release. [skip release] na mensagem só vale para execuções sem tag.
    if: ${{ github.ref_type == 'tag' || !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
      bumped: ${{ steps.get_version.outputs.bumped }}
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Escolher a versão da Release (próxima livre a partir do package.json)
        id: get_version
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::error::Falta o segredo RELEASES_TOKEN (token com escrita em Contents de $RELEASES_REPO). Crie em Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          BUMPED=false
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Disparo por tag: a versão é a da tag (vX.Y.Z), sem bump automático
            if ! echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::A tag '$GITHUB_REF_NAME' não está no formato vX.Y.Z."
              exit 1
            fi
            VERSION="${GITHUB_REF_NAME#v}"
            BASE="$VERSION"
          else
            VERSION=$(node -p "require('./package.json').version")
            BASE="$VERSION"
            # As tags de versão vivem no repositório de releases (é onde as Releases são publicadas)
            TAGS=$(git ls-remote --tags "https://x-access-token:${RELEASES_TOKEN}@github.com/${RELEASES_REPO}.git")
            while echo "$TAGS" | grep -q "refs/tags/v$VERSION$"; do
              if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "::error::A tag 'v$VERSION' já existe e a versão não é X.Y.Z; ajuste o package.json manualmente."
                exit 1
              fi
              VERSION=$(echo "$VERSION" | awk -F. '{printf "%d.%d.%d", $1, $2, $3+1}')
              BUMPED=true
            done
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "bumped=$BUMPED" >> "$GITHUB_OUTPUT"
          echo "Commit avaliado: $(git rev-parse --short HEAD) | package.json: $BASE | Release: v$VERSION (bump automático: $BUMPED)"

  # ------------------------------------------------------------------------------------
  # Cria a Release como RASCUNHO no repositório de releases antes dos builds. Cada build envia seus arquivos
  # direto para ela (gh release upload), sem passar por artefatos do Actions: a cota de armazenamento de
  # artefatos (500 MB no plano gratuito, medida como média do mês) bloqueava a segunda release do mês.
  # Um rascunho não aparece em releases/latest, então o atualizador do app nunca vê uma release pela metade.
  # Reenviar a mesma tag apaga a release anterior dessa tag e começa de novo.
  # ------------------------------------------------------------------------------------
  create-release:
    needs: determine-version
    runs-on: ubuntu-latest
    steps:
      - name: Criar a Release em rascunho
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ needs.determine-version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "Release $TAG já existe: apagando para refazer."
            gh release delete "$TAG" --repo "$RELEASES_REPO" --yes --cleanup-tag || gh release delete "$TAG" --repo "$RELEASES_REPO" --yes
          fi
          gh release create "$TAG" --repo "$RELEASES_REPO" --draft --title "BDS $TAG" --generate-notes
          echo "Rascunho criado: $TAG"

  # ------------------------------------------------------------------------------------
  # Build Windows (mesmos passos validados em build-bds-release.yml)
  # ------------------------------------------------------------------------------------
  build-windows:
    needs: [determine-version, create-release]
    runs-on: windows-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache do electron-builder/Electron (evita re-downloads entre runs)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron-builder
            ${{ github.workspace }}/.cache/electron
          key: electron-builder-win-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            electron-builder-win-

      - name: Instalar dependências
        run: npm ci

      - name: Verificações de qualidade (sintaxe, lint, testes)
        run: |
          npm run check
          npm run lint
          npm test

      - name: Aplicar a versão da Release no build
        shell: pwsh
        run: npm version "${{ needs.determine-version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Garantir pasta data/ (populada em runtime, não versionada)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path data | Out-Null
          New-Item -ItemType File -Force -Path data/.gitkeep | Out-Null

      - name: Verificar assets de ícone
        shell: pwsh
        run: |
          if (-not (Test-Path "assets/icon.ico")) {
            Write-Error "assets/icon.ico não encontrado no repositório. O build do instalador NSIS precisa desse arquivo."
            exit 1
          }

      - name: Build do instalador Windows (NSIS)
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\.cache\electron-builder" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\.cache\electron" | Out-Null

          $builder = Join-Path $PWD 'node_modules\.bin\electron-builder.cmd'
          $maxTries = 3
          $code = 1
          for ($try = 1; $try -le $maxTries; $try++) {
            Write-Host "== electron-builder: tentativa $try/$maxTries =="
            & $builder --win nsis --publish never
            $code = $LASTEXITCODE
            if ($code -eq 0) {
              Write-Host "Instalador Windows gerado com sucesso."
              break
            }
            Write-Host "electron-builder falhou (código $code). Downloads de Electron/NSIS/winCodeSign podem falhar de forma intermitente em runners do GitHub Actions — tentando novamente em 20s..."
            if ($try -lt $maxTries) { Start-Sleep -Seconds 20 }
          }
          if ($code -ne 0) {
            Write-Error "electron-builder falhou após $maxTries tentativas (código $code)."
            exit $code
          }

      - name: Localizar o instalador gerado
        id: find_installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            Write-Error "Nenhum instalador .exe foi encontrado em dist/ após o build."
            exit 1
          }
          echo "installer_path=$($installer.FullName)" >> $env:GITHUB_OUTPUT

      - name: Calcular SHA-256
        shell: pwsh
        run: |
          $hash = Get-FileHash "${{ steps.find_installer.outputs.installer_path }}" -Algorithm SHA256
          $hash.Hash | Out-File -Encoding ascii "${{ steps.find_installer.outputs.installer_path }}.sha256"

      # Zip portátil no padrão do ArtCraft Launcher: o conteúdo de dist/win-unpacked (já gerado pelo build acima) com o
      # exe renomeado para <stem>.exe na raiz do zip.
      - name: Montar o zip portátil (padrão do launcher)
        shell: pwsh
        run: |
          $version = "${{ needs.determine-version.outputs.version }}"
          $unpacked = Join-Path $PWD 'dist\win-unpacked'
          if (-not (Test-Path $unpacked)) {
            Write-Error "dist/win-unpacked não encontrado após o build."
            exit 1
          }
          $exe = Get-ChildItem -Path $unpacked -Filter '*.exe' -File | Select-Object -First 1
          if (-not $exe) {
            Write-Error "Nenhum .exe na raiz de dist/win-unpacked."
            exit 1
          }
          $stage = Join-Path $env:RUNNER_TEMP 'bds-portable'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          Copy-Item -Recurse -Path $unpacked -Destination $stage
          Rename-Item -Path (Join-Path $stage $exe.Name) -NewName "$env:LAUNCHER_STEM.exe"
          $zip = Join-Path $PWD "dist\$env:LAUNCHER_STEM-$version-windows-x64-portable.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Zip portátil: $zip ($([math]::Round((Get-Item $zip).Length / 1MB)) MB)"

      # Direto para a Release em rascunho (sem artefatos do Actions). SHA256SUMS-windows.txt no formato do sha256sum
      # ("<hash minúsculo>  <nome>"): o job de publicação junta os de cada sistema no SHA256SUMS.txt final.
      - name: Enviar os arquivos Windows para a Release (rascunho)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ needs.determine-version.outputs.tag }}
        run: |
          $files = @(Get-ChildItem -Path dist -File | Where-Object { $_.Name -like '*.exe' -or $_.Name -like '*-portable.zip' })
          if ($files.Count -eq 0) { Write-Error "Nenhum instalador ou zip portátil em dist/."; exit 1 }
          $lines = foreach ($f in $files) { "{0}  {1}" -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(), $f.Name }
          [IO.File]::WriteAllText((Join-Path $PWD 'dist\SHA256SUMS-windows.txt'), (($lines | Sort-Object) -join "`n") + "`n")
          Get-Content dist\SHA256SUMS-windows.txt
          $upload = @(Get-ChildItem -Path dist -File | Where-Object { $_.Name -like '*.exe' -or $_.Name -like '*.exe.sha256' -or $_.Name -like '*-portable.zip' -or $_.Name -eq 'SHA256SUMS-windows.txt' }) | ForEach-Object { $_.FullName }
          gh release upload $env:TAG @upload --repo $env:RELEASES_REPO --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ------------------------------------------------------------------------------------
  # Build Linux (mesmos passos validados em build-bds-linux.yml, incluindo smoke-test)
  # ------------------------------------------------------------------------------------
  build-linux:
    needs: [determine-version, create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache do electron-builder/Electron (evita re-downloads entre runs)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron-builder
            ${{ github.workspace }}/.cache/electron
          key: electron-builder-linux-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            electron-builder-linux-

      - name: Instalar dependências
        run: npm ci

      - name: Verificações de qualidade (sintaxe, lint, testes)
        run: |
          npm run check
          npm run lint
          npm test

      - name: Aplicar a versão da Release no build
        run: npm version "${{ needs.determine-version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Garantir pasta data/ (populada em runtime, não versionada)
        run: |
          mkdir -p data
          touch data/.gitkeep

      - name: Verificar assets de ícone
        run: |
          if [ ! -f "assets/icon.png" ]; then
            echo "::error::assets/icon.png não encontrado no repositório."
            exit 1
          fi

      - name: Build dos pacotes Linux (AppImage + deb)
        env:
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cache/electron-builder"
          mkdir -p "$GITHUB_WORKSPACE/.cache/electron"

          BUILDER="$PWD/node_modules/.bin/electron-builder"
          MAX_TRIES=3
          for TRY in 1 2 3; do
            echo "== electron-builder: tentativa $TRY/$MAX_TRIES =="
            if "$BUILDER" --linux AppImage deb --publish never; then
              echo "Pacotes Linux gerados com sucesso."
              exit 0
            fi
            echo "electron-builder falhou. Downloads de Electron/ferramentas AppImage podem falhar de forma intermitente em runners do GitHub Actions — tentando novamente em 20s..."
            if [ "$TRY" -lt "$MAX_TRIES" ]; then
              sleep 20
            fi
          done
          echo "::error::electron-builder falhou após $MAX_TRIES tentativas."
          exit 1

      - name: Localizar os pacotes gerados
        id: find_packages
        run: |
          APPIMAGE=$(find dist -maxdepth 1 -iname "*.AppImage" | head -n1)
          DEB=$(find dist -maxdepth 1 -iname "*.deb" | head -n1)
          if [ -z "$APPIMAGE" ] || [ -z "$DEB" ]; then
            echo "::error::AppImage ou .deb não encontrados em dist/ após o build."
            exit 1
          fi
          echo "appimage_path=$APPIMAGE" >> "$GITHUB_OUTPUT"
          echo "deb_path=$DEB" >> "$GITHUB_OUTPUT"
          chmod +x "$APPIMAGE"

      - name: Calcular SHA-256
        run: |
          sha256sum "${{ steps.find_packages.outputs.appimage_path }}" | awk '{print $1}' > "${{ steps.find_packages.outputs.appimage_path }}.sha256"
          sha256sum "${{ steps.find_packages.outputs.deb_path }}" | awk '{print $1}' > "${{ steps.find_packages.outputs.deb_path }}.sha256"

      - name: Validar estrutura do pacote .deb
        run: dpkg-deb --info "${{ steps.find_packages.outputs.deb_path }}"

      - name: Smoke-test headless do AppImage (Xvfb)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

          cd "$(dirname "${{ steps.find_packages.outputs.appimage_path }}")"
          APPIMAGE_NAME="$(basename "${{ steps.find_packages.outputs.appimage_path }}")"
          "./$APPIMAGE_NAME" --appimage-extract > /dev/null

          EXECUTABLE="squashfs-root/AppRun"
          if [ ! -f "$EXECUTABLE" ]; then
            echo "::error::AppRun não encontrado após extrair o AppImage."
            exit 1
          fi

          LOG_FILE="/tmp/bds_smoketest.log"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
            "$EXECUTABLE" --no-sandbox --disable-gpu > "$LOG_FILE" 2>&1 &
          APP_PID=$!
          sleep 12

          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "✓ Smoke-test OK."
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
          else
            echo "::error::Smoke-test falhou: o processo encerrou sozinho."
            cat "$LOG_FILE" || true
            exit 1
          fi

      # Cópia do AppImage com o nome no padrão do ArtCraft Launcher (o original continua, o atualizador do app o conhece).
      - name: Nomear o AppImage no padrão do launcher
        run: cp "${{ steps.find_packages.outputs.appimage_path }}" "dist/${LAUNCHER_STEM}-${{ needs.determine-version.outputs.version }}-linux-x86_64.AppImage"

      # Direto para a Release em rascunho (sem artefatos do Actions); SHA256SUMS-linux.txt cobre os pacotes, sem os .sha256.
      - name: Enviar os pacotes Linux para a Release (rascunho)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ needs.determine-version.outputs.tag }}
        run: |
          cd dist
          ls -1 *.AppImage *.deb >/dev/null
          sha256sum *.AppImage *.deb | sort -k2 > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt
          gh release upload "$TAG" *.AppImage *.AppImage.sha256 *.deb *.deb.sha256 SHA256SUMS-linux.txt --repo "$RELEASES_REPO" --clobber

  # ------------------------------------------------------------------------------------
  # Publica a Release (tira do rascunho) só depois que os DOIS builds enviaram seus arquivos com sucesso.
  # Se qualquer build falhar, a Release fica em rascunho, invisível para o atualizador do app e para
  # releases/latest: nunca sai uma release incompleta, faltando uma das plataformas.
  # ------------------------------------------------------------------------------------
  release:
    needs: [determine-version, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push do package.json neste repositório (a Release usa o RELEASES_TOKEN, no repositório de releases)
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      TAG: ${{ needs.determine-version.outputs.tag }}
    steps:
      # SHA256SUMS.txt (formato do sha256sum): é o que o ArtCraft Launcher usa para conferir os downloads quando o GitHub
      # não informa o digest do arquivo. Junta as listas parciais que cada build enviou (uma por sistema), que então
      # saem da release. Cobre todos os arquivos, menos os .sha256 individuais.
      - name: Montar o SHA256SUMS.txt a partir das listas de cada build
        run: |
          gh release download "$TAG" --repo "$RELEASES_REPO" --pattern 'SHA256SUMS-*.txt' --dir sums
          ls -la sums/
          cat sums/SHA256SUMS-*.txt | sort -k2 > SHA256SUMS.txt
          echo "---- SHA256SUMS.txt"; cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$RELEASES_REPO" --clobber
          for f in sums/SHA256SUMS-*.txt; do
            gh release delete-asset "$TAG" "$(basename "$f")" --repo "$RELEASES_REPO" --yes
          done

      - name: Conferir os arquivos da Release
        run: gh release view "$TAG" --repo "$RELEASES_REPO" --json assets --jq '.assets[] | "\(.size)\t\(.name)"'

      - name: Publicar a Release (sair do rascunho)
        run: gh release edit "$TAG" --repo "$RELEASES_REPO" --draft=false

      # Registra no package.json a versão que acabou de ser publicada, para o repositório não
      # ficar para trás. Se falhar (ex.: main protegida), a Release continua válida: o próximo
      # run simplesmente escolhe de novo a próxima versão livre.
      - name: Checkout de main para registrar a versão
        if: ${{ needs.determine-version.outputs.bumped == 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Commit da versão no package.json
        if: ${{ needs.determine-version.outputs.bumped == 'true' }}
        continue-on-error: true
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          git add package.json package-lock.json
          git commit -m "chore(release): v$VERSION [skip release]"
          git pull --rebase origin main
          git push origin HEAD:main
