name: Release BDS (Windows + Linux)

# Builda o BDS para Windows E Linux em paralelo e publica os dois numa ÚNICA Release do GitHub.
#
# Como publica (sem artefatos do Actions, cuja cota de 500 MB bloqueava a segunda release do mês):
#   1. create-release cria a Release em RASCUNHO no repositório de releases (RELEASES_REPO);
#   2. cada build envia seus arquivos direto para ela com `gh release upload` (mais um SHA256SUMS-<sistema>.txt);
#   3. release junta as listas no SHA256SUMS.txt e tira a Release do rascunho — só se os dois builds deram certo.
#
# Quando roda:
#   - Ao enviar uma TAG de versão (vX.Y.Z), por exemplo:
#        git tag v1.0.5
#        git push origin v1.0.5
#     A versão da Release é a da tag (sem o "v"); os instaladores já saem com ela. Reenviar a mesma tag
#     (git push --force origin v1.0.5) refaz a Release e substitui os arquivos.
#   - Manual: aba Actions -> "Release BDS (Windows + Linux)" -> "Run workflow". Sem tag, a versão é a próxima livre
#     a partir do package.json (1.0.4 -> 1.0.5 ...) e o workflow registra a versão nova no package.json, com um commit
#     "chore(release): vX.Y.Z [skip release]" na main.
#   - Pushes na main NÃO geram release (só o CI roda).
#
# Os workflows build-bds-release.yml e build-bds-linux.yml (uma plataforma só) ficam apenas como execução manual,
# para não rodarem em duplicidade quando a tag é enviada.
#
# Pré-requisitos (mesmos dos workflows individuais):
#   - assets/icon.ico (Windows) e assets/icon.png (Linux) precisam existir no repositório.
#   - A pasta data/ não precisa estar versionada — cada job cria uma vazia antes do build.
#   - Em Settings -> Actions -> General, "Workflow permissions" deve permitir leitura e escrita
#     (e, se a branch main tiver proteção, o github-actions[bot] precisa poder dar push nela).

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# As RELEASES (instaladores) são publicadas no mesmo repositório público do código: é de lá que o atualizador do app
# baixa (src/config/appUpdate.config.json). Como código e Releases ficam no mesmo repositório, o workflow usa o token do próprio
# repositório (GITHUB_TOKEN, com contents: write nos jobs que publicam); não precisa de um segredo à parte.
env:
  RELEASES_REPO: MauroBragaFilho/Braga_Digital_Studio
  # TODOS os arquivos da Release seguem um padrão só (o do ArtCraft Launcher): <stem>-<versão>-<os>-<arch>[-portable].<ext>
  #   braga-digital-studio-1.2.0-windows-x64.exe            instalador NSIS (assinado; é o que o atualizador do app baixa)
  #   braga-digital-studio-1.2.0-windows-x64-portable.zip   zip portátil (exe na raiz, com o nome do stem)
  #   braga-digital-studio-1.2.0-linux-x86_64.AppImage
  #   braga-digital-studio-1.2.0-linux-x86_64.deb
  #   SHA256SUMS.txt                                         SHA-256 de todos os arquivos acima
  # Os nomes do instalador e dos pacotes Linux vêm do artifactName do package.json (nsis/linux); o atualizador do app
  # (AppUpdateChecker) procura exatamente esse padrão. O stem é o "name" do package.json.
  LAUNCHER_STEM: braga-digital-studio
  # TRANSIÇÃO: nas 2 primeiras Releases publicadas depois da v1.1.1, a Release leva TAMBÉM as cópias com os nomes
  # antigos (BragaDigitalStudioSetup.exe/.AppImage/.deb e o .sha256 de cada um), para quem está numa versão antiga
  # atualizar pelo caminho de sempre. Da 3ª em diante sai só o padrão novo (a conta é feita em determine-version).
  # Depois disso, este bloco e os trechos "nomes antigos" podem ser apagados.
  LEGACY_AFTER: 1.1.1
  LEGACY_RELEASES: 2

# Mínimo por padrão; só o job `release` (publica a Release e dá push da versão) recebe contents: write.
permissions:
  contents: read

# Um release por vez: pushes seguidos entram em fila, para não disputar a mesma versão.
concurrency:
  group: release-bds
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------------------------
  # Lê a versão atual do package.json UMA VEZ e compartilha com os demais jobs, para que
  # a tag/Release use exatamente essa versão, sem risco de builds paralelos lerem valores
  # diferentes (ex: se o package.json mudasse entre um job e outro).
  # ------------------------------------------------------------------------------------
  determine-version:
    # Tag de versão sempre gera a Release. [skip release] na mensagem só vale para execuções sem tag.
    if: ${{ github.ref_type == 'tag' || !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
      bumped: ${{ steps.get_version.outputs.bumped }}
      legacy: ${{ steps.legacy.outputs.legacy }}
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Escolher a versão da Release (próxima livre a partir do package.json)
        id: get_version
        env:
          RELEASES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::error::O token do repositório (GITHUB_TOKEN) não chegou ao passo. Confira Settings -> Actions -> General -> Workflow permissions."
            exit 1
          fi
          BUMPED=false
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Disparo por tag: a versão é a da tag (vX.Y.Z), sem bump automático
            if ! echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::A tag '$GITHUB_REF_NAME' não está no formato vX.Y.Z."
              exit 1
            fi
            VERSION="${GITHUB_REF_NAME#v}"
            BASE="$VERSION"
          else
            VERSION=$(node -p "require('./package.json').version")
            BASE="$VERSION"
            # As tags de versão vivem no repositório de releases (é onde as Releases são publicadas)
            TAGS=$(git ls-remote --tags "https://x-access-token:${RELEASES_TOKEN}@github.com/${RELEASES_REPO}.git")
            while echo "$TAGS" | grep -q "refs/tags/v$VERSION$"; do
              if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "::error::A tag 'v$VERSION' já existe e a versão não é X.Y.Z; ajuste o package.json manualmente."
                exit 1
              fi
              VERSION=$(echo "$VERSION" | awk -F. '{printf "%d.%d.%d", $1, $2, $3+1}')
              BUMPED=true
            done
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "bumped=$BUMPED" >> "$GITHUB_OUTPUT"
          echo "Commit avaliado: $(git rev-parse --short HEAD) | package.json: $BASE | Release: v$VERSION (bump automático: $BUMPED)"

      # Conta as Releases publicadas (sem rascunho) acima de LEGACY_AFTER e abaixo desta: menos de LEGACY_RELEASES
      # = esta Release ainda leva as cópias com os nomes antigos.
      - name: Nomes antigos (transição)
        id: legacy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          newer() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]; }
          COUNT=0
          for T in $(gh release list --repo "$RELEASES_REPO" --exclude-drafts --limit 100 --json tagName -q '.[].tagName'); do
            V="${T#v}"
            echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || continue
            if newer "$V" "$LEGACY_AFTER" && newer "$VERSION" "$V"; then COUNT=$((COUNT+1)); fi
          done
          if newer "$VERSION" "$LEGACY_AFTER" && [ "$COUNT" -lt "$LEGACY_RELEASES" ]; then LEGACY=true; else LEGACY=false; fi
          echo "legacy=$LEGACY" >> "$GITHUB_OUTPUT"
          echo "Releases publicadas depois da v$LEGACY_AFTER: $COUNT | nomes antigos nesta Release: $LEGACY"

  # ------------------------------------------------------------------------------------
  # Cria a Release como RASCUNHO no repositório de releases antes dos builds. Cada build envia seus arquivos
  # direto para ela (gh release upload), sem passar por artefatos do Actions: a cota de armazenamento de
  # artefatos (500 MB no plano gratuito, medida como média do mês) bloqueava a segunda release do mês.
  # Um rascunho não aparece em releases/latest, então o atualizador do app nunca vê uma release pela metade.
  # Reenviar a mesma tag apaga a release anterior dessa tag e começa de novo.
  # ------------------------------------------------------------------------------------
  create-release:
    needs: determine-version
    runs-on: ubuntu-latest
    permissions:
      contents: write   # envia os arquivos para a Release deste repositório
    steps:
      - name: Criar a Release em rascunho
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.determine-version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "Release $TAG já existe: apagando para refazer."
            gh release delete "$TAG" --repo "$RELEASES_REPO" --yes --cleanup-tag || gh release delete "$TAG" --repo "$RELEASES_REPO" --yes
          fi
          gh release create "$TAG" --repo "$RELEASES_REPO" --draft --title "BDS $TAG" --notes "Release em preparação."
          echo "Rascunho criado: $TAG"

  # ------------------------------------------------------------------------------------
  # Build Windows (mesmos passos validados em build-bds-release.yml)
  # ------------------------------------------------------------------------------------
  build-windows:
    needs: [determine-version, create-release]
    runs-on: windows-latest
    permissions:
      contents: write   # envia os arquivos para a Release deste repositório
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # histórico completo: a assinatura confere que a tag pertence à main

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache do electron-builder/Electron (evita re-downloads entre runs)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron-builder
            ${{ github.workspace }}/.cache/electron
          key: electron-builder-win-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            electron-builder-win-

      - name: Instalar dependências
        run: npm ci

      - name: Verificações de qualidade (sintaxe, lint, testes)
        run: |
          npm run check
          npm run lint
          npm test

      - name: Aplicar a versão da Release no build
        shell: pwsh
        run: npm version "${{ needs.determine-version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Garantir pasta data/ (populada em runtime, não versionada)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path data | Out-Null
          New-Item -ItemType File -Force -Path data/.gitkeep | Out-Null

      - name: Verificar assets de ícone
        shell: pwsh
        run: |
          if (-not (Test-Path "assets/icon.ico")) {
            Write-Error "assets/icon.ico não encontrado no repositório. O build do instalador NSIS precisa desse arquivo."
            exit 1
          }

      # Release sem as LUTs embutidas (ou com procedência "a-confirmar") não é publicado: falha aqui, antes do build.
      - name: Conferir as LUTs embutidas (release)
        shell: pwsh
        run: npm run verify:package -- --release

      - name: Build do instalador Windows (NSIS)
        shell: pwsh
        env:
          BDS_RELEASE: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\.cache\electron-builder" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\.cache\electron" | Out-Null

          $builder = Join-Path $PWD 'node_modules\.bin\electron-builder.cmd'
          $maxTries = 3
          $code = 1
          for ($try = 1; $try -le $maxTries; $try++) {
            Write-Host "== electron-builder: tentativa $try/$maxTries =="
            & $builder --win nsis --publish never
            $code = $LASTEXITCODE
            if ($code -eq 0) {
              Write-Host "Instalador Windows gerado com sucesso."
              break
            }
            Write-Host "electron-builder falhou (código $code). Downloads de Electron/NSIS/winCodeSign podem falhar de forma intermitente em runners do GitHub Actions — tentando novamente em 20s..."
            if ($try -lt $maxTries) { Start-Sleep -Seconds 20 }
          }
          if ($code -ne 0) {
            Write-Error "electron-builder falhou após $maxTries tentativas (código $code)."
            exit $code
          }

      # Assinatura Authenticode (SignPath Foundation): só em tag de versão cujo commit esteja na main (CODE_SIGNING_POLICY.md).
      # Troca o instalador de dist/ pelo assinado ANTES do SHA-256 e do upload, então o atualizador do app
      # e o SHA256SUMS.txt já recebem o arquivo assinado. Só o instalador é assinado (o zip portátil não).
      # Requer o secret SIGNPATH_API_TOKEN e as variables SIGNPATH_ORGANIZATION_ID (+ opcionais SIGNPATH_PROJECT_SLUG,
      # SIGNPATH_SIGNING_POLICY). Guia: .docs/ASSINATURA_SIGNPATH.md.
      # OPCIONAL: sem o token ou sem o Organization ID, a assinatura é PULADA e o instalador sai sem assinar (o atualizador
      # do app confere o SHA-256, não a assinatura). Com os dois configurados, a assinatura volta a ser exigida.
      - name: Conferir que a tag pertence à main
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::O commit da tag $GITHUB_REF_NAME não está na main. Só builds da main são assinados."
            exit 1
          fi

      - name: Decidir se assina
        id: sign
        shell: bash
        env:
          SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = "tag" ] && [ -n "$SIGNPATH_TOKEN" ] && [ -n "$SIGNPATH_ORG" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Sem SIGNPATH_API_TOKEN ou SIGNPATH_ORGANIZATION_ID (ou fora de tag): o instalador sai SEM assinatura."
          fi

      - name: Enviar o instalador sem assinatura (artefato do GitHub)
        if: ${{ steps.sign.outputs.sign == 'true' }}
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: installer-unsigned
          path: dist/${{ env.LAUNCHER_STEM }}-${{ needs.determine-version.outputs.version }}-windows-x64.exe
          retention-days: 1

      - name: Assinar na SignPath (aguarda a aprovação e baixa o assinado)
        if: ${{ steps.sign.outputs.sign == 'true' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'braga-digital-studio' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 86400
          output-artifact-directory: signed

      - name: Conferir a assinatura e usar o instalador assinado
        if: ${{ steps.sign.outputs.sign == 'true' }}
        shell: pwsh
        run: |
          $name = "$env:LAUNCHER_STEM-${{ needs.determine-version.outputs.version }}-windows-x64.exe"
          $signed = Join-Path $PWD "signed/$name"
          if (-not (Test-Path $signed)) { Write-Error "Instalador assinado não encontrado em signed/."; exit 1 }
          $sig = Get-AuthenticodeSignature $signed
          Write-Host "Assinatura: $($sig.Status) | $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { Write-Error "Assinatura inválida: $($sig.Status)"; exit 1 }
          Copy-Item $signed "dist/$name" -Force

      - name: Localizar o instalador gerado
        id: find_installer
        shell: pwsh
        run: |
          $name = "$env:LAUNCHER_STEM-${{ needs.determine-version.outputs.version }}-windows-x64.exe"
          $installer = Get-Item -Path (Join-Path 'dist' $name) -ErrorAction SilentlyContinue
          if (-not $installer) {
            Write-Error "O instalador $name não foi encontrado em dist/ após o build."
            exit 1
          }
          echo "installer_path=$($installer.FullName)" >> $env:GITHUB_OUTPUT

      # Zip portátil no padrão do ArtCraft Launcher: o conteúdo de dist/win-unpacked (já gerado pelo build acima) com o
      # exe renomeado para <stem>.exe na raiz do zip.
      - name: Montar o zip portátil (padrão do launcher)
        shell: pwsh
        run: |
          $version = "${{ needs.determine-version.outputs.version }}"
          $unpacked = Join-Path $PWD 'dist\win-unpacked'
          if (-not (Test-Path $unpacked)) {
            Write-Error "dist/win-unpacked não encontrado após o build."
            exit 1
          }
          $exe = Get-ChildItem -Path $unpacked -Filter '*.exe' -File | Select-Object -First 1
          if (-not $exe) {
            Write-Error "Nenhum .exe na raiz de dist/win-unpacked."
            exit 1
          }
          $stage = Join-Path $env:RUNNER_TEMP 'bds-portable'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          Copy-Item -Recurse -Path $unpacked -Destination $stage
          Rename-Item -Path (Join-Path $stage $exe.Name) -NewName "$env:LAUNCHER_STEM.exe"
          $zip = Join-Path $PWD "dist\$env:LAUNCHER_STEM-$version-windows-x64-portable.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Zip portátil: $zip ($([math]::Round((Get-Item $zip).Length / 1MB)) MB)"

      # Direto para a Release em rascunho (sem artefatos do Actions). SHA256SUMS-windows.txt no formato do sha256sum
      # ("<hash minúsculo>  <nome>"): o job de publicação junta os de cada sistema no SHA256SUMS.txt final.
      - name: Enviar os arquivos Windows para a Release (rascunho)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.determine-version.outputs.tag }}
        run: |
          # Só os arquivos no padrão do nome (fica de fora o que mais o electron-builder deixar em dist/).
          $prefix = "$env:LAUNCHER_STEM-${{ needs.determine-version.outputs.version }}-windows-x64"
          $files = @(Get-ChildItem -Path dist -File | Where-Object { $_.Name -eq "$prefix.exe" -or $_.Name -eq "$prefix-portable.zip" })
          if ($files.Count -ne 2) { Write-Error "Esperava $prefix.exe e $prefix-portable.zip em dist/."; exit 1 }
          if ($files.Count -eq 0) { Write-Error "Nenhum instalador ou zip portátil em dist/."; exit 1 }
          $lines = foreach ($f in $files) { "{0}  {1}" -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(), $f.Name }
          [IO.File]::WriteAllText((Join-Path $PWD 'dist\SHA256SUMS-windows.txt'), (($lines | Sort-Object) -join "`n") + "`n")
          Get-Content dist\SHA256SUMS-windows.txt
          $upload = @($files | ForEach-Object { $_.FullName }) + (Join-Path $PWD 'dist\SHA256SUMS-windows.txt')
          # Transição: cópia do instalador com o nome antigo (o atualizador das versões até a 1.1.1 procura esse nome).
          if ('${{ needs.determine-version.outputs.legacy }}' -eq 'true') {
            $old = Join-Path $PWD 'dist\legacy\BragaDigitalStudioSetup.exe'
            New-Item -ItemType Directory -Force (Split-Path $old) | Out-Null
            Copy-Item (Join-Path $PWD "dist\$prefix.exe") $old -Force
            (Get-FileHash $old -Algorithm SHA256).Hash | Out-File -Encoding ascii "$old.sha256"
            $upload += @($old, "$old.sha256")
            Write-Host "Nomes antigos: BragaDigitalStudioSetup.exe (+ .sha256) também vai para a Release."
          }
          gh release upload $env:TAG @upload --repo $env:RELEASES_REPO --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ------------------------------------------------------------------------------------
  # Build Linux (mesmos passos validados em build-bds-linux.yml, incluindo smoke-test)
  # ------------------------------------------------------------------------------------
  build-linux:
    needs: [determine-version, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # envia os arquivos para a Release deste repositório
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache do electron-builder/Electron (evita re-downloads entre runs)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ github.workspace }}/.cache/electron-builder
            ${{ github.workspace }}/.cache/electron
          key: electron-builder-linux-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            electron-builder-linux-

      - name: Instalar dependências
        run: npm ci

      - name: Verificações de qualidade (sintaxe, lint, testes)
        run: |
          npm run check
          npm run lint
          npm test

      - name: Aplicar a versão da Release no build
        run: npm version "${{ needs.determine-version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Garantir pasta data/ (populada em runtime, não versionada)
        run: |
          mkdir -p data
          touch data/.gitkeep

      - name: Verificar assets de ícone
        run: |
          if [ ! -f "assets/icon.png" ]; then
            echo "::error::assets/icon.png não encontrado no repositório."
            exit 1
          fi

      - name: Conferir as LUTs embutidas (release)
        run: npm run verify:package -- --release

      - name: Build dos pacotes Linux (AppImage + deb)
        env:
          BDS_RELEASE: '1'
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
          ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cache/electron-builder"
          mkdir -p "$GITHUB_WORKSPACE/.cache/electron"

          BUILDER="$PWD/node_modules/.bin/electron-builder"
          MAX_TRIES=3
          for TRY in 1 2 3; do
            echo "== electron-builder: tentativa $TRY/$MAX_TRIES =="
            if "$BUILDER" --linux AppImage deb --publish never; then
              echo "Pacotes Linux gerados com sucesso."
              exit 0
            fi
            echo "electron-builder falhou. Downloads de Electron/ferramentas AppImage podem falhar de forma intermitente em runners do GitHub Actions — tentando novamente em 20s..."
            if [ "$TRY" -lt "$MAX_TRIES" ]; then
              sleep 20
            fi
          done
          echo "::error::electron-builder falhou após $MAX_TRIES tentativas."
          exit 1

      - name: Localizar os pacotes gerados
        id: find_packages
        run: |
          PREFIX="dist/${LAUNCHER_STEM}-${{ needs.determine-version.outputs.version }}-linux-x86_64"
          APPIMAGE="$PREFIX.AppImage"
          DEB="$PREFIX.deb"
          if [ ! -f "$APPIMAGE" ] || [ ! -f "$DEB" ]; then
            echo "::error::$APPIMAGE ou $DEB não encontrados após o build."
            ls -la dist || true
            exit 1
          fi
          echo "appimage_path=$APPIMAGE" >> "$GITHUB_OUTPUT"
          echo "deb_path=$DEB" >> "$GITHUB_OUTPUT"
          chmod +x "$APPIMAGE"

      - name: Validar estrutura do pacote .deb
        run: dpkg-deb --info "${{ steps.find_packages.outputs.deb_path }}"

      - name: Smoke-test headless do AppImage (Xvfb)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

          cd "$(dirname "${{ steps.find_packages.outputs.appimage_path }}")"
          APPIMAGE_NAME="$(basename "${{ steps.find_packages.outputs.appimage_path }}")"
          "./$APPIMAGE_NAME" --appimage-extract > /dev/null

          EXECUTABLE="squashfs-root/AppRun"
          if [ ! -f "$EXECUTABLE" ]; then
            echo "::error::AppRun não encontrado após extrair o AppImage."
            exit 1
          fi

          LOG_FILE="/tmp/bds_smoketest.log"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
            "$EXECUTABLE" --no-sandbox --disable-gpu > "$LOG_FILE" 2>&1 &
          APP_PID=$!
          sleep 12

          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "✓ Smoke-test OK."
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
          else
            echo "::error::Smoke-test falhou: o processo encerrou sozinho."
            cat "$LOG_FILE" || true
            exit 1
          fi

      # Direto para a Release em rascunho (sem artefatos do Actions); SHA256SUMS-linux.txt cobre os dois pacotes.
      - name: Enviar os pacotes Linux para a Release (rascunho)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.determine-version.outputs.tag }}
        run: |
          APPIMAGE="$(basename "${{ steps.find_packages.outputs.appimage_path }}")"
          DEB="$(basename "${{ steps.find_packages.outputs.deb_path }}")"
          cd dist
          sha256sum "$APPIMAGE" "$DEB" | sort -k2 > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt
          gh release upload "$TAG" "$APPIMAGE" "$DEB" SHA256SUMS-linux.txt --repo "$RELEASES_REPO" --clobber
          # Transição: cópias com os nomes antigos e o .sha256 de cada uma.
          if [ "${{ needs.determine-version.outputs.legacy }}" = "true" ]; then
            mkdir -p legacy
            cp "$APPIMAGE" legacy/BragaDigitalStudioSetup.AppImage
            cp "$DEB" legacy/BragaDigitalStudioSetup.deb
            for F in legacy/BragaDigitalStudioSetup.AppImage legacy/BragaDigitalStudioSetup.deb; do
              sha256sum "$F" | awk '{print $1}' > "$F.sha256"
            done
            gh release upload "$TAG" legacy/* --repo "$RELEASES_REPO" --clobber
            echo "Nomes antigos: BragaDigitalStudioSetup.AppImage/.deb (+ .sha256) também foram para a Release."
          fi

  # ------------------------------------------------------------------------------------
  # Publica a Release (tira do rascunho) só depois que os DOIS builds enviaram seus arquivos com sucesso.
  # Se qualquer build falhar, a Release fica em rascunho, invisível para o atualizador do app e para
  # releases/latest: nunca sai uma release incompleta, faltando uma das plataformas.
  # ------------------------------------------------------------------------------------
  release:
    needs: [determine-version, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push do package.json neste repositório (a Release usa o mesmo token do repositório)
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.determine-version.outputs.tag }}
    steps:
      # SHA256SUMS.txt (formato do sha256sum): é o que o ArtCraft Launcher usa para conferir os downloads quando o GitHub
      # não informa o digest do arquivo. Junta as listas parciais que cada build enviou (uma por sistema), que então
      # saem da release. Cobre todos os arquivos publicados.
      - name: Montar o SHA256SUMS.txt a partir das listas de cada build
        run: |
          gh release download "$TAG" --repo "$RELEASES_REPO" --pattern 'SHA256SUMS-*.txt' --dir sums
          ls -la sums/
          cat sums/SHA256SUMS-*.txt | sort -k2 > SHA256SUMS.txt
          echo "---- SHA256SUMS.txt"; cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$RELEASES_REPO" --clobber
          for f in sums/SHA256SUMS-*.txt; do
            gh release delete-asset "$TAG" "$(basename "$f")" --repo "$RELEASES_REPO" --yes
          done

      # Lista de mudanças (como no Braga Frame): o título de cada commit desde a tag de versão anterior, sem os prefixos
      # "fix:", "feat(ia):"... e sem os commits de versão. Sem tag anterior, os últimos 20 commits.
      - name: Checkout do código (histórico completo, para a lista de mudanças)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          path: code

      - name: Escrever as notas da Release
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"
          SHA=$(awk -v f="${LAUNCHER_STEM}-${VERSION}-windows-x64.exe" '$2==f {print $1}' SHA256SUMS.txt)
          cd code
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="-n 20 HEAD"; fi
          {
            echo "Instalador para Windows 10 e 11 (64 bits), zip portátil e pacotes para Linux (AppImage e .deb)."
            echo
            if [ -n "$SHA" ]; then echo "SHA-256 do instalador Windows: \`$SHA\`"; echo; fi
            echo "O SHA-256 de todos os arquivos está no SHA256SUMS.txt."
            echo
            echo "## Mudanças"
            # shellcheck disable=SC2086
            git log --no-merges --pretty='%s' $RANGE \
              | grep -v -E '^chore\(release\)' \
              | sed -E 's/^[a-z]+(\([^)]*\))?!?:[[:space:]]*//; s/^./\U&/; s/^/- /'
          } > ../notas.md
          cat ../notas.md
          gh release edit "$TAG" --repo "$RELEASES_REPO" --notes-file ../notas.md

      - name: Conferir os arquivos da Release
        run: gh release view "$TAG" --repo "$RELEASES_REPO" --json assets --jq '.assets[] | "\(.size)\t\(.name)"'

      - name: Publicar a Release (sair do rascunho)
        run: gh release edit "$TAG" --repo "$RELEASES_REPO" --draft=false

      # Registra no package.json a versão que acabou de ser publicada, para o repositório não
      # ficar para trás. Se falhar (ex.: main protegida), a Release continua válida: o próximo
      # run simplesmente escolhe de novo a próxima versão livre.
      - name: Checkout de main para registrar a versão
        if: ${{ needs.determine-version.outputs.bumped == 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Commit da versão no package.json
        if: ${{ needs.determine-version.outputs.bumped == 'true' }}
        continue-on-error: true
        run: |
          VERSION="${{ needs.determine-version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          git add package.json package-lock.json
          git commit -m "chore(release): v$VERSION [skip release]"
          git pull --rebase origin main
          git push origin HEAD:main
