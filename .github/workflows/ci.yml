name: CI

# Verificações rápidas em todo push/PR: sintaxe, lint e testes unitários.
# Não gera instalador (isso é feito pelos workflows de release).

on:
  push:
    branches: ['**']
  pull_request: {}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Sintaxe
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test
