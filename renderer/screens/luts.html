<div class="luts-screen-container">
  
  <!-- CABEÇALHO -->
  <div class="luts-header">
    <div class="luts-tabs">
      <div class="luts-tab active">MEUS LUTs</div>
    </div>
    
    <div class="luts-header-actions">
      <div class="luts-search">
        <input type="text" id="lutSearchInput" class="luts-search-input" placeholder="Buscar LUT...">
        <span class="material-symbols-rounded luts-search-icon">search</span>
      </div>
      
      <div class="luts-filters">
        <select class="lut-select" id="lutSortFilter">
          <option value="recent">Mais recentes</option>
          <option value="name">Nome (A-Z)</option>
          <option value="size">Tamanho</option>
        </select>
        <button class="lut-icon-btn lut-view-mode-btn" id="btnListView" title="Ver em lista">
            <span class="material-symbols-rounded">format_list_bulleted</span>
        </button>
        <button class="lut-icon-btn lut-view-mode-btn" id="btnCompactView" title="Ver compacto">
            <span class="material-symbols-rounded">view_list</span>
        </button>
        <button class="lut-icon-btn lut-view-mode-btn active" id="btnGridView" title="Ver em grade">
            <span class="material-symbols-rounded">grid_view</span>
        </button>
      </div>

      <button class="lut-icon-btn" id="btnRefreshLuts" title="Atualizar">
          <span class="material-symbols-rounded">sync</span>
      </button>

      <button type="button" id="btnImportLut" class="lut-btn-primary">
        <span class="material-symbols-rounded">add</span> IMPORTAR LUT
      </button>
    </div>
  </div>

  <!-- CONTEÚDO PRINCIPAL (Grid e Inspector) -->
  <div class="luts-content">
    
    <!-- GRID DE LUTS -->
    <div class="luts-grid-area">
      <div id="lutsGrid" class="luts-grid"></div>
      
      <div id="lutsEmptyState" class="luts-empty-state hidden">
        <span class="material-symbols-rounded luts-empty-icon">gradient</span>
        <span class="luts-empty-text">Nenhum LUT encontrado.</span>
      </div>
    </div>

    <!-- INSPECTOR LATERAL -->
    <div class="luts-inspector">
      <div class="inspector-header">
        <span class="inspector-title">INSPECTOR</span>
        <button class="lut-icon-btn lut-icon-btn-small" id="btnCloseInspector" type="button">
            <span class="material-symbols-rounded">close</span>
        </button>
      </div>

      <div id="inspectorContent" class="inspector-content">
        <!-- COMPONENTE ANTES/DEPOIS -->
        <div class="lut-slider-container" id="lutSliderContainer">
          <img src="./assets/lut_preview.jpg" class="lut-slider-img lut-slider-img-base" draggable="false">
          <div class="lut-slider-label lut-slider-label-before">ANTES</div>
          
          <div class="lut-slider-overlay" id="lutSliderOverlay">
            <img src="./assets/lut_preview.jpg" class="lut-slider-img lut-slider-img-target" id="lutSliderTargetImg" draggable="false">
            <div class="lut-slider-label lut-slider-label-after">DEPOIS</div>
          </div>
          
          <div class="lut-slider-divider" id="lutSliderDivider">
            <div class="lut-slider-handle">
              <span class="material-symbols-rounded">code</span>
            </div>
          </div>
        </div>

        <div class="inspector-header-info">
          <h2 id="insName" class="inspector-name">Selecione um LUT</h2>
          <span class="lut-badge lut-badge-3d">3D LUT</span>
        </div>

        <div class="inspector-details">
          <div class="detail-row"><span class="detail-label">Tipo</span><span id="insType" class="detail-value">--</span></div>
          <div class="detail-row"><span class="detail-label">Tamanho</span><span id="insSize" class="detail-value">--</span></div>
          <div class="detail-row"><span class="detail-label">Data de criação</span><span id="insDate" class="detail-value">--</span></div>
        </div>

        <div class="inspector-section inspector-actions-section">
          <h3 class="inspector-section-title">AÇÕES</h3>
          <div class="inspector-actions">
            <button id="btnSendLutToBDSM" class="lut-btn-primary lut-btn-full-width" disabled>
              APLICAR LUT
            </button>
            <button class="lut-btn-outline lut-btn-full-width" id="btnFullscreenLut">
              VISUALIZAR EM TELA CHEIA <span class="material-symbols-rounded">open_in_full</span>
            </button>
            <button class="lut-btn-outline lut-btn-full-width" id="btnRenameLut">
              RENOMEAR <span class="material-symbols-rounded">edit</span>
            </button>
            <button class="lut-btn-outline lut-btn-full-width lut-btn-danger" id="btnDeleteLut">
              EXCLUIR <span class="material-symbols-rounded">delete</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- RODAPÉ -->
  <div class="luts-footer">
    <span class="luts-footer-text">Total: <span id="ftTotal" class="luts-footer-highlight">0 LUTs</span></span>
    <span class="luts-footer-separator">|</span>
    <span class="luts-footer-text">Selecionado: <span id="ftSelected" class="luts-footer-highlight">0 LUT</span></span>
  </div>


  <!-- MODAL FULLSCREEN -->
  <div id="lutFullscreenModal" class="lut-fullscreen-modal hidden">
    
    <div class="lut-fullscreen-header">
      <h2 id="fsLutName" class="lut-fullscreen-title">Nome do LUT</h2>
      <span class="lut-fullscreen-subtitle">Pré-visualização em Tela Cheia</span>
    </div>
    
    <button id="btnFsClose" class="lut-icon-btn lut-fullscreen-close-btn" type="button">
      <span class="material-symbols-rounded">close</span>
    </button>
    
    <div class="lut-slider-container lut-slider-fullscreen" id="fsSliderContainer">
      <img src="./assets/lut_preview.jpg" class="lut-slider-img lut-slider-img-base" draggable="false">
      <div class="lut-slider-label lut-slider-label-before">ANTES</div>
      
      <div class="lut-slider-overlay" id="fsSliderOverlay">
        <img src="./assets/lut_preview.jpg" class="lut-slider-img lut-slider-img-target" id="fsSliderTargetImg" draggable="false">
        <div class="lut-slider-label lut-slider-label-after">DEPOIS</div>
      </div>
      
      <div class="lut-slider-divider" id="fsSliderDivider">
        <div class="lut-slider-handle">
          <span class="material-symbols-rounded">code</span>
        </div>
      </div>
    </div>
  </div>
</div>
