<div style="width: 100%; height: 100%; display: flex; flex-direction: column;">
  <div style="padding: 15px; background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between;">
    <h2 style="font-size: 16px; font-weight: 700; color: #fff; margin: 0; display: flex; align-items: center; gap: 8px;">
      <span class="material-symbols-rounded" style="color: #FF0000;">cloud_upload</span>
      Painel de Envio Manual (YouTube Studio)
    </h2>
    <div style="font-size: 12px; color: var(--muted);">
      Envie vídeos diretamente por esta tela, usando a conta conectada.
    </div>
  </div>
  <webview 
    id="youtubeStudioView" 
    src="https://studio.youtube.com" 
    partition="persist:youtube"
    allowpopups
    style="flex: 1; width: 100%; border: none; background: #fff;"
  ></webview>
</div>
