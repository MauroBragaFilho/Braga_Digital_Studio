<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- CSP: scripts só do próprio app; estilos inline permitidos (usados pelas telas); fontes só locais (Material Symbols empacotada em assets/fonts);
       imagens/mídia locais (file:, bds-thumb:) e https (miniaturas remotas). Testado carregando módulos ES, import() e fetch() via file://. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: file: bds-thumb: https:; media-src 'self' blob: file: data: bds-thumb:; connect-src 'self' file: bds-thumb:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>Braga Digital Studio</title>
  <link rel="icon" href="../assets/icon.png" />
  <link rel="stylesheet" href="./material-symbols.css" />
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./shell.css">
  <link rel="stylesheet" href="./components/preview/photo-preview.css">
  <link rel="stylesheet" href="./components/preview/video-preview.css">
  <link rel="stylesheet" href="./components/preview/audio-preview.css">
  <link rel="stylesheet" href="./components/preview/preview-popup.css">
  <link rel="stylesheet" href="./components/ai-assistant.css">
  <script src="./boot-gate.js"></script>
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar" aria-label="Navegação">
      <div class="brand">
        <!-- Letras do logotipo (assets/bds-letters.svg) embutidas para o tema claro poder recolorir B e D via CSS -->
        <div class="brand-mark" role="img" aria-label="BDS">
          <svg viewBox="22 86 217 61" focusable="false" aria-hidden="true">
            <defs>
              <linearGradient id="bdsMetal" x1="0" y1="0" x2="0" y2="1">
                <stop class="bds-metal-a" offset="0%" stop-color="#f8f8f8"/>
                <stop class="bds-metal-b" offset="55%" stop-color="#dedede"/>
                <stop class="bds-metal-c" offset="100%" stop-color="#a9a9a9"/>
              </linearGradient>
              <linearGradient id="bdsRed" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ef262b"/>
                <stop offset="100%" stop-color="#b30008"/>
              </linearGradient>
            </defs>
            <g fill="url(#bdsMetal)">
              <path d="M 37 89 L 24 144 L 82 144 L 88 141 L 92 137 L 95 131 L 95 127 L 96 126 L 93 117 L 98 112 L 101 105 L 101 97 L 98 92 L 91 89 Z"/>
              <path d="M 110 89 L 109 90 L 109 94 L 106 103 L 106 107 L 103 116 L 103 120 L 102 121 L 97 144 L 147 144 L 155 140 L 159 136 L 163 129 L 163 126 L 168 109 L 168 101 L 166 96 L 161 91 L 155 89 Z"/>
            </g>
            <path fill="url(#bdsRed)" d="M 237 89 L 191 89 L 183 92 L 177 98 L 175 102 L 174 111 L 176 116 L 180 120 L 184 122 L 214 122 L 217 124 L 218 128 L 213 134 L 167 134 L 164 144 L 215 144 L 220 142 L 224 139 L 229 131 L 229 127 L 230 126 L 229 119 L 224 113 L 221 112 L 191 112 L 186 108 L 186 105 L 187 103 L 191 100 L 234 100 L 236 96 Z"/>
          </svg>
        </div>
        <div class="brand-text">
          <strong>BRAGA DIGITAL STUDIO</strong>
        </div>
        <button id="sidebarToggleBtn" class="sidebar-toggle-btn" type="button"
                title="Recolher menu" aria-label="Alternar menu lateral" aria-expanded="true">
          <span class="material-symbols-rounded">menu_open</span>
        </button>
      </div>

      <nav class="tabs">
        <button class="tab-button" data-view="home" type="button">
          <span class="material-symbols-rounded">home</span>
          Home
        </button>
        <button class="tab-button" data-view="download" type="button">
          <span class="material-symbols-rounded">download</span>
          Downloads
        </button>
        <button class="tab-button" data-view="converter" type="button">
          <span class="material-symbols-rounded">sync</span>
          Conversor
        </button>
        <button class="tab-button hidden" data-view="recovery" type="button" style="display: none;">
          <span class="material-symbols-rounded">healing</span>
          Recuperar
        </button>
        <button class="tab-button hidden" data-view="montage" type="button" style="display: none;">
          <span class="material-symbols-rounded">movie</span>
          Montagem de Vídeos
        </button>
        <button class="tab-button" data-view="silence" type="button">
          <span class="material-symbols-rounded">graphic_eq</span>
          Remover Silêncio
        </button>
        <button class="tab-button" data-view="metadata" type="button">
          <span class="material-symbols-rounded">label</span>
          Metadados
        </button>
        <button class="tab-button" data-view="transcription" type="button">
          <span class="material-symbols-rounded">subtitles</span>
          Transcrição
        </button>
        <button class="tab-button" data-view="library" type="button">
          <span class="material-symbols-rounded">video_library</span>
          Biblioteca
        </button>
        <button class="tab-button" data-view="projects" type="button">
          <span class="material-symbols-rounded">folder_special</span>
          Projetos
        </button>
        <button class="tab-button" data-view="upload" type="button">
          <span class="material-symbols-rounded">cloud_upload</span>
          Envio
        </button>
        <button class="tab-button" data-view="devices" type="button">
          <span class="material-symbols-rounded">devices</span>
          Dispositivos
        </button>
        <button class="tab-button" data-view="luts" type="button">
          <span class="material-symbols-rounded">palette</span>
          LUTs
        </button>
        <button class="tab-button" data-view="settings" type="button">
          <span class="material-symbols-rounded">settings</span>
          Configurações
          <span class="nav-update-badge hidden" id="settingsUpdateBadge" title="Atualizações disponíveis"></span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="footer-status">
          <section class="tool-state">
            <span class="state-dot" id="stateDot"></span>
            <span id="stateText" role="status" aria-live="polite">Pronto</span>
          </section>
          <button type="button" id="shortcutsHelpBtn" class="shortcuts-help-btn" title="Atalhos de teclado (?)" aria-label="Atalhos de teclado">
            <span class="material-symbols-rounded" aria-hidden="true">keyboard</span>
          </button>
        </div>
        <div id="storageIndicators" class="storage-indicators"></div>
      </div>
    </aside>

    <div class="main-column">
      <header class="global-header">
        <div class="header-left">
          <h1 class="page-title" id="globalPageTitle">Home</h1>
          <div class="header-divider"></div>
          <span id="globalMediaCount" class="global-media-count hidden">0 mídias encontradas</span>
        </div>

        <div class="search-wrapper">
          <div class="search-inner">
            <button type="button" id="globalSearchBtn" class="search-icon-btn" title="Pesquisar (Enter)" aria-label="Pesquisar">
              <span class="material-symbols-rounded">search</span>
            </button>
            <input type="text" placeholder="Pesquisar por nome, codec, projeto, origem..." id="globalSearch" autocomplete="off">
            <button type="button" id="globalSearchClear" class="search-clear-btn hidden" title="Limpar pesquisa (Esc)" aria-label="Limpar pesquisa">
              <span class="material-symbols-rounded">close</span>
            </button>
          </div>
          <button type="button" id="globalSearchShortcut" class="shortcut" title="Clique ou use Ctrl+K, / ou Ctrl+F">Ctrl + K</button>
        </div>

        <div class="header-actions">
          <div class="window-controls">
            <button id="win-full" class="win-btn" title="Tela Cheia"><span class="material-symbols-rounded">fullscreen</span></button>            
            <button id="win-min" class="win-btn" title="Minimizar"><span class="material-symbols-rounded">remove</span></button>
            <button id="win-max" class="win-btn" title="Maximizar"><span class="material-symbols-rounded">check_box_outline_blank</span></button>
            <button id="win-close" class="win-btn win-close-btn" title="Fechar"><span class="material-symbols-rounded">close</span></button>
          </div>
        </div>
      </header>
      <section class="content" id="dynamic-content"></section>
      
      <!-- Footer global de downloads ativos -->
      <div id="globalDownloadFooter" class="global-download-footer hidden">
        <div class="gdf-progress-track">
          <div id="gdfProgressFill" class="gdf-progress-fill"></div>
        </div>
        <div class="gdf-info">
          <div class="gdf-left">
            <span class="material-symbols-rounded gdf-icon">downloading</span>
            <span id="gdfTitle" class="gdf-title">Baixando mídia...</span>
          </div>
          <div class="gdf-right">
            <span id="gdfStats" class="gdf-stats">--</span>
            <span id="gdfPercent" class="gdf-percent">0%</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <dialog id="playlistDialog">
    <form method="dialog">
      <h2>Playlist detectada</h2>
      <p><strong>Nome:</strong> <span id="playlistName"></span></p>
      <p><strong>Quantidade de itens:</strong> <span id="playlistCount"></span></p>
      <menu>
        <button value="cancel" class="secondary">Cancelar</button>
        <button value="confirm" class="primary red">Continuar</button>
      </menu>
    </form>
  </dialog>

  <!-- Overlay de Dependências Iniciais -->
  <div id="initOverlay" class="init-overlay hidden">
    <svg class="init-spinner" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="2" x2="12" y2="6"></line>
      <line x1="12" y1="18" x2="12" y2="22"></line>
      <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
      <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
      <line x1="2" y1="12" x2="6" y2="12"></line>
      <line x1="18" y1="12" x2="22" y2="12"></line>
      <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
      <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
    </svg>
    <h2 class="init-title">Baixando componentes essenciais...</h2>
    <p class="init-subtitle">Isso acontece apenas na primeira vez que você abre o aplicativo.</p>
  </div>

  <!-- MODAL GLOBAL BDS -->
  <dialog id="bdsGlobalModal" class="bds-modal" aria-labelledby="bdsModalTitle" aria-describedby="bdsModalMessage">
    <div class="bds-modal-content">
      <div class="bds-modal-header">
        <span class="material-symbols-rounded bds-modal-icon" id="bdsModalIcon">info</span>
        <h3 id="bdsModalTitle">Mensagem</h3>
      </div>
      <div class="bds-modal-body">
        <p id="bdsModalMessage">Corpo da mensagem.</p>
        <input type="text" id="bdsModalInput" class="bds-input hidden" autocomplete="off">
      </div>
      <div class="bds-modal-footer">
        <button type="button" id="bdsModalBtnCancel" class="bds-btn-secondary hidden">Cancelar</button>
        <button type="button" id="bdsModalBtnConfirm" class="bds-btn-primary">OK</button>
      </div>
    </div>
  </dialog>

  <script src="./app.js" type="module"></script>
</body>
</html>
